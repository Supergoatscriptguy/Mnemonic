#   bin\chatdocs and bin\tokenize each, then
#   bin\chatpack datasets\math\noisyb.tok datasets\math\noisyb1.tok datasets\math\noisyb2.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack5.tok datasets\math\val5.tok ctx=2048 seed=7
