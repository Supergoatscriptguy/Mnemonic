# math2: a second pass over all 31 topics with the working written the newer way
# (every power and repeated factor labelled, short division when simplifying, like
# terms two at a time, ranges sorted first), from math's last checkpoint. none of
# eval2's problems are in it:
#   bin\mathgen n=1000000 seed=201 (202) split=train skip=datasets\math\eval2.txt out=datasets\math\polish1.txt (2)
#   bin\mathgen n=4000 seed=1234 split=eval skip=datasets\math\eval2.txt out=datasets\math\val3.txt
#   bin\chatdocs and bin\tokenize each, then
#   bin\chatpack datasets\math\polish.tok datasets\math\polish1.tok datasets\math\polish2.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack3.tok datasets\math\val3.tok ctx=2048 seed=7
# score it on datasets\math\eval2c.txt, eval2 without the 15 word problems math saw
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\math\step_00011684.ckpt
data = datasets\math\polish.tok
val = datasets\math\valpack3.tok

batch = 131072          # 64 blocks a step
tokens = 410910720      # 3135 steps, one pass over polish.tok (200674 blocks), ~3.8 h
lr = 1e-4               # half of math's: most of it is learned, a few formats changed
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1338

val_every = 500
val_batches = 40        # 160 rows
log_every = 10
save_every = 1000
save_minutes = 30
keep = 3
prompt = What is the 25th term of 4, 11, 18, 25, ...?
sample_len = 300
