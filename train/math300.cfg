# math300: the 300M chat model turned into a math one. mathgen's problems, worked
# out step by step (long multiplication and division, prime factorization, linear
# equations, factoring x^2 + bx + c, polynomial division), one pass:
#   bin\mathgen n=530000 seed=1 split=train out=datasets\math\train.txt
#   bin\mathgen n=3000 seed=1234 split=eval out=datasets\math\val.txt
#   bin\chatdocs, bin\tokenize, then
#   bin\chatpack datasets\math\sft.tok datasets\math\train.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack.tok datasets\math\val.tok ctx=2048 seed=7
# val is held-out problems (split=eval never shows up in train). bin\matheval scores it
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\chat300\step_00002968.ckpt
data = datasets\math\sft.tok
val = datasets\math\valpack.tok

batch = 131072          # 64 blocks a step
tokens = 101.4e6        # one pass over sft.tok (49535 blocks): 774 steps, ~55 min
lr = 1e-4               # chat300's
min_lr = 0.1
warmup = 50
wd = 0.1
clip = 1.0
seed = 1337

val_every = 100
val_batches = 20        # 80 rows
log_every = 10
save_every = 250
save_minutes = 20
keep = 3
prompt = What is 47 × 23?
sample_len = 200
