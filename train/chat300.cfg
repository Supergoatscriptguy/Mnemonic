# chat300: fine-tunes the 300M (stretch) into the chat model, one pass. smol-smoltalk
# plus the 300M identity set x12, packed into blocks of 2048 with whole turns only:
#   bin\chatpack datasets\chat\sft2048.tok datasets\chat\train-0000{0,1,2,3}-of-00004.tok +datasets\chat\identity-300m.tok*12 ctx=2048 seed=7
#   bin\chatpack datasets\chat\val2048.tok datasets\chat\test-00000-of-00001.tok ctx=2048
# x12 is about as much identity as the 126M's separate identity pass saw (~3M tokens),
# but spread through the whole run. if identity loss on idval300.tok is still high
# afterwards, a short identity pass on top fixes it
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\stretch\step_00019074.ckpt
data = datasets\chat\sft2048.tok
val = datasets\chat\val2048.tok

batch = 131072          # 64 blocks a step
tokens = 389.0e6        # one pass over sft2048.tok (189996 blocks): 2968 steps, ~3.4 h
lr = 1e-4               # 1/5 of pretraining's, same ratio as the 126M's chat run
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1337

val_every = 200
val_batches = 20
log_every = 10
save_every = 500
save_minutes = 20
keep = 3
prompt = Hi! Who are you?
sample_len = 120
