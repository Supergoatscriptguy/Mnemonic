# math8: math7 on mathgen with dice, coins, cards and whole-power logs all in train
# (the 1 bucket in 16 that eval keeps had "2 coins, all heads", which math7 then said was
# 3/4), 87 fractional logs instead of 16, lists with no commas, log3(9), 2nd derivative.
# from math7's last step:
#   (skip8.txt = eval2.txt + messy.txt + messy6.txt + messy7.txt + messy8.txt, blank lines between)
#   bin\mathgen n=1000000 seed=801 split=train skip=datasets\math\skip8.txt out=datasets\math\m8a.txt
#   bin\mathgen n=1000000 seed=802 split=train skip=datasets\math\skip8.txt
#       only=units,money,change,probability,square,log,derivative out=datasets\math\m8b.txt
#   bin\chatdocs each, bin\tokenize ... dig3=2, then
#   bin\chatpack datasets\math\m8.tok datasets\math\m8a.tok datasets\math\m8b.tok ctx=2048 seed=7
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\math7\step_00003488.ckpt
data = datasets\math\m8.tok
val = datasets\math\valpack7.tok

batch = 131072          # 64 blocks a step
tokens = 463863808      # 3539 steps, one pass over m8.tok (226532 blocks), ~4.2 h
lr = 1e-4
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1362

val_every = 500
val_batches = 40        # 160 rows
log_every = 10
save_every = 1000
save_minutes = 30
keep = 3
prompt = What is the probability of getting heads 2 times in a row?
sample_len = 300
