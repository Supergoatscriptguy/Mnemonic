# stretch: ~304M params, a long local run. 2048 context
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4               # 4 x 2048 = 8K tokens per micro-batch. 14.9 of 15.9 GiB. micro 2 is 5% slower, 4.6 GiB less
streams = 2             # weight gradients on a second stream: 8% faster, same bits (streams=1 to go back)

batch = 524288
tokens = 10e9           # 19073 steps, ~3.9 days at 30K tok/s. shards 0-199 have 10.95B
lr = 5e-4               # main was fine at 1e-3 (1.67x gpt-3's 6e-4 for 125M); same ratio on gpt-3's 3e-4 for 350M
min_lr = 0.1
warmup = 1000
wd = 0.1
clip = 1.0
seed = 1337

val_every = 250         # ~75 min
val_batches = 40
log_every = 10
save_every = 1000
save_minutes = 30
keep = 3
prompt = The history of
