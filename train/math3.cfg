# math3: questions the way people type them (noise.asm: lowercase, no spaces around
# the signs, * x / ² ³, commas in big numbers, "whats", "pls") and more ways to ask
# ("5 squared", "sqrt(50)", "how many times does 12 go into 1500", the equation first).
# from math2 871 steps in (it had the newer working down by then, and this has it too).
# none of eval2's problems are in it:
#   bin\mathgen n=1250000 seed=301 (302) split=train skip=datasets\math\eval2.txt out=datasets\math\noisy1.txt (2)
#   bin\mathgen n=4000 seed=4321 split=eval skip=datasets\math\eval2.txt out=datasets\math\val4.txt
#   bin\chatdocs and bin\tokenize each, then
#   bin\chatpack datasets\math\noisy.tok datasets\math\noisy1.tok datasets\math\noisy2.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack4.tok datasets\math\val4.tok ctx=2048 seed=7
# score it on datasets\math\eval2c.txt (tidy) and math\messy.txt (typed)
