# chat: fine-tunes main into a chat model. smol-smoltalk plus the identity set,
# packed by chatpack into blocks of 1024 (so no row starts mid-conversation).
# starts from main's final weights with a fresh optimizer. loss on the assistant's
# tokens only
n_layer = 16
d_model = 768
n_head = 12
n_kv_head = 4
ffn = 2048
ctx = 1024
vocab = 32768
micro = 8

init = checkpoints\main\step_00009537.ckpt
data = datasets\chat\sft.tok
val = datasets\chat\val.tok

batch = 131072          # 128 blocks a step
tokens = 333.5e6        # one pass over sft.tok (325686 blocks), 2545 steps
lr = 2e-4
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1337

val_every = 200
val_batches = 20
log_every = 10
save_every = 500
save_minutes = 20
keep = 3
prompt = Hi! Who are you?
sample_len = 120
