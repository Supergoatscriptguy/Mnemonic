# chatid: a short second pass after chat, so the model knows who it is. starts from
# the chat run's weights. the data is the identity set many times over, shuffled in
# with one smol-smoltalk file so it keeps its manners. the + puts every identity
# conversation first in its block, with nothing before it to copy the answer from:
#   bin\chatpack datasets\chat\id.tok datasets\chat\train-00003-of-00004.tok +datasets\chat\identity.tok*500 ctx=1024 seed=11
# only the first ~40M tokens get used
n_layer = 16
d_model = 768
n_head = 12
n_kv_head = 4
ffn = 2048
ctx = 1024
vocab = 32768
micro = 8

init = checkpoints\chat\step_00002545.ckpt
data = datasets\chat\id.tok
val = datasets\chat\val.tok

batch = 131072
tokens = 40e6           # ~305 steps, ~10 min
lr = 1e-4
min_lr = 0.1
warmup = 20
wd = 0.1
clip = 1.0
seed = 1337

val_every = 50
val_batches = 20
log_every = 10
save_every = 1000
save_minutes = 20
keep = 2
prompt = Hi! Who are you?
sample_len = 80
