# math6: math5 plus seven new topics (units, money, percent change, probability, x^2 = k,
# logs, derivatives), and half the questions tokenized the way llama.cpp splits numbers
# (in 3s), so it reads prompts right in Ollama too. the answers stay as they were.
# from math5's last step:
#   bin\mathgen n=1000000 seed=601 (603) split=train skip=datasets\math\eval2.txt out=datasets\math\m6a.txt (m6c)
#   bin\mathgen n=1000000 seed=602 split=train skip=datasets\math\eval2.txt
#       only=units,money,change,probability,square,log,derivative out=datasets\math\m6b.txt
#   bin\mathgen n=4000 seed=6544 split=eval skip=datasets\math\eval2.txt out=datasets\math\val7.txt
#   bin\chatdocs each, bin\tokenize ... dig3=2, then
#   bin\chatpack datasets\math\m6.tok datasets\math\m6a.tok datasets\math\m6b.tok datasets\math\m6c.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack7.tok datasets\math\val7.tok ctx=2048 seed=7
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\math5\step_00003159.ckpt
data = datasets\math\m6.tok
val = datasets\math\valpack7.tok

batch = 131072          # 64 blocks a step
tokens = 671219712      # 5121 steps, one pass over m6.tok (327753 blocks), ~5.8 h
lr = 1e-4
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1360

val_every = 500
val_batches = 40        # 160 rows
log_every = 10
save_every = 1000
save_minutes = 30
keep = 3
prompt = What is 15% off $80?
sample_len = 300
