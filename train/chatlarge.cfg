# chatlarge: fine-tunes the 755M (large) into the chat model, one pass. smol-smoltalk
# plus the 755M identity set x12 (identity-300m.txt with the facts swapped), packed
# into blocks of 2048 with whole turns only:
#   bin\chatpack datasets\chat\sft-large.tok datasets\chat\train-0000{0,1,2,3}-of-00004.tok +datasets\chat\identity-large.tok*12 ctx=2048 seed=7
#   bin\chatpack datasets\chat\idval-large.tok +datasets\chat\identity-large-val.tok ctx=2048
# same recipe as chat300. fp8 and adam16 because that's what fits in 16 GB
n_layer = 28
d_model = 1536
n_head = 24
n_kv_head = 8
ffn = 4096
ctx = 2048
vocab = 32768
micro = 1
streams = 2
fp8 = 1
adam16 = 1

init = checkpoints\large\step_00028611.ckpt
data = datasets\chat\sft-large.tok
val = datasets\chat\val2048.tok

batch = 131072          # 64 blocks a step
tokens = 389.0e6        # one pass over sft-large.tok (189971 blocks): 2968 steps, ~5.1 h
lr = 8e-5               # 1/5 of pretraining's, the ratio the 126M and 300M chat runs used
min_lr = 0.1
warmup = 100
wd = 0.1
clip = 1.0
seed = 1337

val_every = 200
val_batches = 80        # 80 rows at micro 1: the same rows chat300's 20 x micro 4 measured
log_every = 10
save_every = 500
save_minutes = 20
keep = 3
prompt = Hi! Who are you?
sample_len = 120
