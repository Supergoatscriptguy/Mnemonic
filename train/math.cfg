# math: the 300M chat model trained on all 31 of mathgen's topics, from column
# addition to the quadratic formula. 1.5B tokens, one pass:
#   bin\mathgen n=1900000 seed=101 (102, 103, 104) split=train out=datasets\math\big1.txt (2, 3, 4)
#   bin\mathgen n=4000 seed=1234 split=eval out=datasets\math\val2.txt
#   bin\mathgen n=3100 seed=999 split=eval out=datasets\math\eval2.txt     (matheval's)
#   bin\chatdocs and bin\tokenize each, then
#   bin\chatpack datasets\math\big.tok datasets\math\big1.tok ... big4.tok ctx=2048 seed=7
#   bin\chatpack datasets\math\valpack2.tok datasets\math\val2.tok ctx=2048 seed=7
n_layer = 24
d_model = 1024
n_head = 16
n_kv_head = 4
ffn = 2816
ctx = 2048
vocab = 32768
micro = 4
streams = 2

init = checkpoints\chat300\step_00002968.ckpt
data = datasets\math\big.tok
val = datasets\math\valpack2.tok

batch = 131072          # 64 blocks a step
tokens = 1531445248     # 11684 steps, one pass over big.tok (747789 blocks), ~14 h
lr = 2e-4               # twice the chat runs': far more data, and all of it new to the model
min_lr = 0.1
warmup = 200
wd = 0.1
clip = 1.0
seed = 1337

val_every = 500
val_batches = 40        # 160 rows
log_every = 10
save_every = 1000
save_minutes = 30
keep = 3
prompt = Solve 2x^2 + 3x - 5 = 0.
sample_len = 300
